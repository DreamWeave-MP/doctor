# doctor as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `doctor-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "66795eef-6cc5-41f2-b8ed-d373c78e5f42"
slug = "doctor"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.doctor"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
