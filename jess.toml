manifest_version = 1

[package]
id = "org.dreamweave.doctor"
version = "0.1.0"
jess_api = "1"
include = ["src"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3cmd" = "0.1"
"org.dreamweave.load-order" = "0.1"
"org.dreamweave.openmw" = "0.1"
"org.dreamweave.plugin-assets" = "0.1"

[modules]
"@doctor" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A check reads the load order's content files and the models
# they use, and writes its report, so its caller needs filesystem.read and filesystem.write.

[[layer]]
id = "doctor.core"
requires = ["tes3.core", "tes3cmd.core", "load-order.core", "openmw.core", "plugin-assets.core"]
exports = ["@doctor"]
