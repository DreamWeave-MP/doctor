manifest_version = 1

[package]
id = "org.dreamweave.doctor"
version = "0.1.0"
jess_api = "1"
default_target = "doctor"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/cli.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.esm" = "0.1"
"org.dreamweave.tes3cmd" = "0.1"
"org.dreamweave.openmw-content" = "0.1"
"org.dreamweave.openmw-install" = "0.1"
"org.dreamweave.plugin-assets" = "0.1"

# The suite builds the models its load orders use with the NIF module.
[dev-dependencies]
"org.dreamweave.nif" = "0.1"

[modules]
"@doctor" = "src/init.jsl"
"@doctor/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A check reads the load order's content files and the models
# they use, and writes its report, so its caller needs filesystem.read and filesystem.write.

[[layer]]
id = "doctor.core"
requires = ["esm.core", "tes3cmd.core", "openmw-content.core", "openmw-install.core", "plugin-assets.core"]
exports = ["@doctor", "@doctor/cli"]

# The doctor's command line: `src/main.jsl` hands its arguments to `@doctor/cli`. A run reads the
# configuration chain, its data folders' listings and archives, the content files, the models they
# use, and each master's size (filesystem.read); writes its report, backing up the one already
# there (filesystem.write); and reads OPENMW_CONFIG when --config doesn't name the configuration
# (process.environment). It runs no other program and opens no connection.

[targets.doctor]
kind = "command"
command = "doctor"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.environment", "process.stdio"]
